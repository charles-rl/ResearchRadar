# config.yaml — Project ResearchRadar
# Automated Knowledge Manifold Optimization for Robotics
#
# Phase 1/2 configuration: literature harvesting across three conflicting
# robotics paradigms (Obayashi et al. 2026, Knowledge Manifold Optimization).

corpus:
  # Seed-First Expansion.  The 15 hand-picked seeding PDFs in
  # fulltext.seeds_dir occupy doc 1..doc 15; freshly harvested papers fill
  # doc 16..doc 120.  seeds + harvested = target_total_papers.
  seed_dir: "docs/papers/desired"
  seed_count: 15
  target_total_papers: 120
  # 120 - 15 seeds = 105 harvested, split evenly across the three regimes.
  # The corpus is exactly balanced at 35 harvested per regime; a seed joins the
  # regime it is assigned to, so the final per-regime count is 35 + its share
  # of the 15 seeds.
  target_per_regime: 35
  output_path: "data/corpus.json"

  # --- Recency window (dynamic, not a rigid 3-year cutoff) -----------------
  # Harvested papers start at (earliest seed year - seed_year_offset), clamped
  # so the lookback never exceeds lookback_years.  This keeps the harvested
  # literature temporally adjacent to the anchoring seeds instead of opening an
  # artificial gap in front of an older seed (Obayashi et al. 2026, Sec. 5.1).
  # Seeds themselves are always kept, regardless of their publication year.
  seed_year_offset: 2
  lookback_years: 10

  # --- Seed -> regime assignment: override with fallback -------------------
  # Priority 1: an explicit mapping in this block wins, keyed by PDF filename
  #             (e.g. "cassie biped.pdf": 2).
  # Priority 2: any seed not listed here is assigned automatically to the
  #             regime whose centroid (its harvested documents plus its keyword
  #             bundle) is closest in TF-IDF cosine similarity.  Every
  #             assignment is logged so it can be audited or overridden.
  # Priority 1 for the seed regime label.  Left empty on purpose: the automatic
  # TF-IDF cosine fallback (Priority 2) is audited in the build log, and every
  # seeding paper below is a genuine multi-regime paper that a human may want to
  # pin differently.  Example:
  #   seed_overrides:
  #     "TD JEPA.pdf": 2
  seed_overrides: {}
  # Reviewer flag: warn when the automatic similarity margin between the best
  # and second-best regime is below this value, i.e. the seed is ambiguous.
  seed_match_margin: 0.02

  # arXiv API client paging (Phase 2)
  page_size: 100             # results per HTTP request
  max_query_results: 400     # hard ceiling of candidates scanned per regime
  delay_seconds: 3.0         # polite delay between paged requests (arXiv ToS)
  num_retries: 5

  # Minimum abstract length in whitespace-delimited words.
  # Stubs/withdrawn records carry degenerate abstracts that corrupt the manifold.
  min_abstract_words: 40

  # Review/survey exclusion keywords (Obayashi et al. 2026, Sec. 5.1).
  # Review articles intentionally aggregate broad areas of prior work and
  # therefore distort local semantic density and kernel interpolation.
  exclude_review_keywords:
    - "review"
    - "survey"
    - "overview"
    - "progress in"
    - "recent advances"
    - "roadmap"
    - "perspectives on"

  # Opening-sentence abstract patterns that mark a review/survey even when the
  # title is neutral (Sec. 5.1 operationalization).
  exclude_review_abstract_patterns:
    - "a comprehensive survey"
    - "this survey"
    - "this review"
    - "we survey"
    - "we review the"
    - "an overview of recent"
    - "review of the literature"
    - "literature review"

regimes:
  - id: 0
    name: "Classical System Identification"
    label: "SysID"
    description: >-
      Analytical / grey-box models, least squares, Kalman filtering, state
      estimation for robotic and control systems.
    query: 'abs:"system identification" AND (cat:cs.RO OR cat:eess.SY)'
    # Domain keywords are used ONLY to match seeds to regimes.  They never
    # reach the arXiv query above, which stays as validated.
    keywords:
      - "system identification"
      - "kalman filter"
      - "least squares"
      - "grey-box model"

  - id: 1
    name: "Domain Randomization & Sim-to-Real"
    label: "Sim2Real"
    description: >-
      Stochastic physics perturbation, domain randomization, reality-gap
      transfer bounds.
    query: 'abs:"domain randomization" AND abs:"sim-to-real" AND cat:cs.RO'
    keywords:
      - "sim-to-real"
      - "domain randomization"
      - "dynamics perturbation"

  - id: 2
    name: "Deep Reinforcement Learning Control"
    label: "RL"
    description: >-
      Policy gradient, actor-critic, PPO, stochastic policies, exploration and
      sample efficiency for robotic manipulation.
    query: 'abs:"reinforcement learning" AND abs:"manipulation" AND cat:cs.RO'
    keywords:
      - "reinforcement learning"
      - "policy gradient"
      - "robot manipulation"

# Phase 1: full-text extraction (Obayashi et al. 2026, Sec. 5.2: "PDF text was
# extracted without OCR").  The paper never relied on abstract-only text, and
# neither do we: TF-IDF n-grams, the semantic field v(x), and the local lenses
# all consume full document text.
fulltext:
  output_path: "data/corpus_fulltext.json"
  # User-curated seeding papers.  This is the single intentional structural
  # difference from the paper: their corpus was seeded by a literature-search
  # engine, ours is seeded by these hand-picked robotics papers and then
  # expanded by citation snowballing into the 120-paper analysis corpus.
  seeds_dir: "docs/papers/desired"
  cache_dir: "data/fulltext_cache"
  delay_seconds: 3.0
  # Extraction sanity gate.  All three checks must pass; each catches a
  # different failure mode (empty/truncated, broken font encoding, symbol soup).
  min_words: 1000
  mean_word_length_range: [3.5, 9.0]
  # Letters+digits share of the non-whitespace characters, counted with Unicode
  # semantics so Greek math does not read as soup.  Obayashi et al. (2026) give
  # 75% as the bar; the cleaned corpus sits at 0.83-0.95 and a broken extraction
  # (symbol soup) sits near 0.
  min_alnum_ratio: 0.75
  ar5iv_fallback: true

# ---------------------------------------------------------------------------
# Phase 2: within-word character n-gram TF-IDF (Obayashi et al. 2026, Sec. 5.2)
#
# The paper builds NO neural embedding.  Documents are represented by
# within-word character n-grams (n = 4..7) weighted by sublinear term frequency
# and smoothed inverse document frequency, and the SAME weighted matrix is
# normalised two ways: L2 for the map and the semantic gradient, L1 for the
# feature-allocation view used when reading evidence packages.
# ---------------------------------------------------------------------------
tfidf:
  ngram_range: [4, 7]                 # Sec. 5.2: character n-grams, n = 4..7
  max_features: 250000                # Sec. 5.2: at most 250,000 features
  sublinear_tf: true                  # tf' = 1 + log(tf)
  idf: "log(1 + N/df) + 1"            # smoothed idf, documented verbatim
  lowercase: true
  matrix_path: "data/sparse_tfidf.npz"
  vocab_path: "data/tfidf_vocab.json"

# ---------------------------------------------------------------------------
# LEGACY (Phases 1-3 of the original plan, superseded).
#
# The F2LLM/Ollama embedding path is kept for reference only.  No pipeline
# stage reads these keys any more: Obayashi et al. (2026) use sparse TF-IDF and
# explicitly state that no language model is used in any objective or in the
# frontier extraction (Sec. 5.5).  See docs/implementation-notes.md.
# ---------------------------------------------------------------------------
ollama:
  host: "http://localhost:11434"
  embed_endpoint: "/api/embed"
  embeddings_endpoint: "/api/embeddings"
  # Ollama tags registered from the GGUF builds in models/gguf/ (see README)
  model: "codefuse-ai/F2LLM-4B"            # primary; 2560-dim, bf16, ~7.6 GB
  fallback_model: "codefuse-ai/F2LLM-0.6B" # fallback / unit tests; 1024-dim
  hf_model: "codefuse-ai/F2LLM-4B"         # upstream HF identifier
  hf_fallback_model: "codefuse-ai/F2LLM-0.6B"
  batch_size: 16
  timeout_seconds: 300
  keep_alive: "30m"                        # keep weights resident across batches
  embeddings_cache: "data/embeddings.npy"
  cache_manifest: "data/embeddings_cache.json"

# Locally downloaded weights (git-ignored, not redistributed)
models:
  local_root: "models"
  f2llm_4b: "models/F2LLM-4B"
  f2llm_0_6b: "models/F2LLM-0.6B"
  gguf_root: "models/gguf"
  gguf_4b: "models/gguf/F2LLM-4B-bf16.gguf"
  gguf_0_6b: "models/gguf/F2LLM-0.6B-bf16.gguf"

manifold:
  grid_size: 21           # 21x21 = 441 evaluation points (Obayashi et al. Sec. 5.5)
  grid_output: "data/manifold_grid.npz"
  bounds: [-1.0, 1.0]     # Chart Omega = [-1, 1]^2 (Obayashi et al. Sec. 2.1)
  sph_h: 0.25             # Kernel smoothing parameter
  nearest_k: 8            # Adaptive neighborhood scale (Obayashi et al. Sec. 5.4)
  perimeter_anchors: 8    # + 1 central anchor = 9 gauge-fixing anchors (Sec. 5.2)
  norm_percentiles: [10, 90]     # N+ / N- normalization percentiles (Eqs. 9-10)
  use_empirical_quantiles: true  # recompute W() quantiles from this corpus's d_nn
  q_whitespace:           # Empirical quantiles for band-pass W(x) (Eq. 12, Eq. 28)
    q20: 0.0517
    q60: 0.1000
    q85: 0.1376
    q98: 0.2000

pareto:
  # Practical Pareto constraint: drop zero-white-space edge artifacts
  output_path: "data/pareto_solutions.json"
  min_whitespace: 0.0
  objectives: ["P_boundary", "W", "G", "S"]
  ideal_point: [1.0, 1.0, 1.0, 1.0]
  archetype_radius: 0.35   # chart-space radius grouping front points into archetypes

output:
  html_path: "output/radar_map.html"
  report_path: "output/RADAR_REPORT.md"
  dashboard_path: "output/index.html"
  dashboard_template: "templates/dashboard.html"

audit:
  # Appendix A.2 post-generation checklist applied to whatever an LLM returns
  # for output/KMO_PROMPT_TOP1.txt. These bounds are verbatim from A.2 item 1.
  task_a_words: [200, 280]   # Task A must land in this window
  task_b_words: 45           # Task B must be exactly this many words
  task_b_tolerance: 0        # the paper says "exactly"; no slack by default
  max_supported_df: 3        # L1-only terms at or below this df need a [doc N]
  emergent_df: 4             # L1-only terms at or above this df are emergent topics
